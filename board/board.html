<style>

      <span id="updated"></span>
      <span id="read-at"></span>

    </div>

    <a href="#team">团队</a>

    <a href="#decisions">决策</a>
  </nav>

<script>
(function () {
  var D = JSON.parse(document.getElementById('board-data').textContent);
  var LABEL = { done: '已完成', doing: '进行中', todo: '未开始', wait: '等你' };

  // 创始人的回复。saved 来自看板的数据库；drafts 是还没保存的输入，切换视图时不丢。
  var saved = {};
  var drafts = {};
  var store = { db: null, state: 'loading' }; // loading | ready | slow | off
  var saving = {};
  var failed = {};
  var readAt = null;          // 最近一次从数据库读到回复的时间
  var room = null;            // 用来把“我填好了”发到你和 Claude 的对话里
  var canSend = 'off';

  function clock(d) {
    function two(n) { return (n < 10 ? '0' : '') + n; }
    return two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());
  }
  function sendable() {
    return !!room && (canSend === 'available' || canSend === 'available_if_summoned' || canSend === 'available_if_opened');
  }
  function paintHeader() {
    document.getElementById('updated').textContent = '看板更新于 ' + D.meta.updated;
    document.getElementById('read-at').textContent = readAt ? '回复读取于 ' + clock(readAt) : '';
    document.getElementById('refresh').textContent = sendable() ? '刷新并通知 Claude' : '刷新';
  }
  function tell(text) {
    var el = document.getElementById('refresh-state');
    el.textContent = text;
    el.hidden = !text;
  }

  function esc(v) {
    return String(v).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function dot(s) {
    return '<span class="s ' + (s === 'todo' ? '' : esc(s)) + '" role="img" aria-label="' + LABEL[s] + '" title="' + LABEL[s] + '"></span>';
  }
  function item(t, s, small) {
    return '<li class="item">' + dot(s) + '<div><span>' + esc(t) + '</span>' +
      (small ? '<small>' + esc(small) + '</small>' : '') + '</div></li>';
  }
  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    function two(n) { return (n < 10 ? '0' : '') + n; }
    return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' + two(d.getHours()) + ':' + two(d.getMinutes());
  }
  function current(id) {
    var a = drafts[id] || saved[id] || {};
    return { choice: a.choice || '', text: a.text || '' };
  }
  function isDirty(id) {
    if (!drafts[id]) return false;
    var s = saved[id] || {};
    return (drafts[id].choice || '') !== (s.choice || '') || (drafts[id].text || '') !== (s.text || '');
  }

  function needBlock(n) {
    var opts = n.options.map(function (o) {
      return '<button type="button" class="opt" data-opt="' + esc(o) + '" aria-pressed="false">' + esc(o) + '</button>';
    }).join('');
    return '<div class="need" data-need="' + esc(n.id) + '">' +
      '<div class="need-title">' + dot('wait') + '<span>' + esc(n.t) + '</span></div>' +
      '<p class="need-desc">' + esc(n.d) + '</p>' +
      (n.warn ? '<p class="need-warn">' + esc(n.warn) + '</p>' : '') +
      (opts ? '<div class="opts" role="group" aria-label="' + esc(n.t) + '">' + opts + '</div>' : '') +
      '<textarea id="answer-' + esc(n.id) + '" aria-label="' + esc(n.t) + '：回复" placeholder="' + esc(n.placeholder || '') + '"></textarea>' +
      '<div class="need-foot"><button type="button" class="save" data-save>保存</button><span class="state" aria-live="polite"></span></div>' +
    '</div>';
  }

  // 把数据库里的回复和未保存的输入填回表单，并更新每一项的状态文字。不重画表单，所以不会打断正在输入的内容。
  function paintAnswers() {
    var note = document.getElementById('store-note');
    if (note) {
      note.textContent = store.state === 'ready' ? '在这里直接回复，保存后我能读到。'
        : store.state === 'loading' ? '正在读取你之前的回复…'
        : store.state === 'slow' ? '暂时连不上保存回复的地方，下面显示的可能不是最新的。'
        : '这次打开的方式保存不了回复。请在 Claude 里打开看板再填写。';
    }
    var blocks = document.querySelectorAll('[data-need]');
    for (var i = 0; i < blocks.length; i++) {
      var el = blocks[i], id = el.getAttribute('data-need'), cur = current(id);
      var buttons = el.querySelectorAll('.opt');
      for (var j = 0; j < buttons.length; j++) {
        buttons[j].setAttribute('aria-pressed', buttons[j].getAttribute('data-opt') === cur.choice ? 'true' : 'false');
      }
      var ta = el.querySelector('textarea');
      if (ta !== document.activeElement && ta.value !== cur.text) ta.value = cur.text;
      var dirty = isDirty(id), btn = el.querySelector('[data-save]'), st = el.querySelector('.state');
      btn.disabled = !store.db || !!saving[id] || !dirty;
      st.className = 'state';
      if (saving[id]) st.textContent = '正在保存…';
      else if (failed[id]) { st.textContent = failed[id]; st.className = 'state bad'; }
      else if (dirty) st.textContent = '有未保存的修改';
      else if (saved[id] && (saved[id].choice || saved[id].text)) { st.textContent = '已保存 · ' + when(saved[id].at); st.className = 'state ok'; }
      else st.textContent = '还没有回复';
    }
    var marks = document.querySelectorAll('[data-answer-of]');
    for (var k = 0; k < marks.length; k++) {
      var a = saved[marks[k].getAttribute('data-answer-of')];
      marks[k].innerHTML = a && (a.choice || a.text)
        ? '<span class="chip">你已回复</span> ' + esc(a.choice || '') + (a.choice && a.text ? '：' : '') + esc(a.text || '')
        : '<a href="#today">去“今日”回复</a>';
    }
  }

  function viewToday() {
    var m = D.meta, cells = '';
    for (var i = 1; i <= m.totalDays; i++) {
      var c = i < m.day ? 'past' : (i === m.day ? 'now' : '');
      if (i === 7 || i === m.totalDays) c += ' gate';
      cells += '<i class="' + c + '" title="第 ' + i + ' 天"></i>';
    }
    return '<h2>' + esc(m.headline) + '</h2>' +
      '<div class="card stack">' +
        '<div class="dayline"><span>两周上线计划 <strong>第 ' + m.day + ' 天 / 共 ' + m.totalDays + ' 天</strong></span>' +
        '<span>检查点在第 7 天和第 14 天，目标上线日 ' + esc(m.launch) + '</span></div>' +
        '<div class="days" aria-hidden="true">' + cells + '</div>' +
      '</div>' +
      '<div class="grid g4">' + D.counts.map(function (c) {
        return '<div class="card count"><div class="v">' + esc(c.value) + '</div><div class="l">' + esc(c.label) +
          '</div><div class="t">' + esc(c.target) + '</div></div>';
      }).join('') + '</div>' +
      '<div class="card waitc needs"><div class="needs-head"><p class="h3">等你做的 ' + D.needs.length + ' 件事</p>' +
        '<span class="store-note" id="store-note"></span></div>' +
        D.needs.map(needBlock).join('') + '</div>' +
      '<div class="grid g2">' +
        '<div class="card stack"><p class="h3">已完成</p><ul class="items">' +
          D.done.map(function (t) { return item(t, 'done'); }).join('') + '</ul></div>' +
        '<div class="card stack"><p class="h3">下一步</p><ul class="items">' +
          D.next.map(function (t) { return item(t, 'todo'); }).join('') + '</ul></div>' +
      '</div>';
  }

  function viewPlan() {
    var m = D.meta;
    var phases = D.phases.map(function (p) {
      return '<div class="phase ' + esc(p.s) + (p.gate ? ' gate' : '') + '"><div class="hd">' + dot(p.s) + '<span>' + esc(p.name) +
        '</span></div><div class="dt">' + esc(p.dates) + '</div><div class="ln">' + esc(p.line) + '</div></div>';
    }).join('');
    var pk = D.packages.map(function (p) {
      var cells = '';
      for (var i = 1; i <= m.totalDays; i++) {
        var inside = i >= p.from && i <= p.to;
        cells += '<i class="' + (inside ? (p.to < m.day ? 'past' : (p.from <= m.day ? 'now' : 'later')) : '') + '"></i>';
      }
      var cur = m.day >= p.from && m.day <= p.to;
      return '<div class="card pkg' + (cur ? ' cur' : '') + '">' +
        '<div class="when"><b>' + (p.from === p.to ? '第 ' + p.from + ' 天' : '第 ' + p.from + ' 至 ' + p.to + ' 天') +
          '</b><span>' + esc(p.dates) + '</span><div class="days" aria-hidden="true">' + cells + '</div></div>' +
        '<div><h3>' + esc(p.title) + '</h3><ul class="items">' +
          p.tasks.map(function (t) { return item(t.t, t.s); }).join('') + '</ul>' +
          (p.check ? '<div class="check"><span class="s wait"></span>' + esc(p.check) + '</div>' : '') +
        '</div></div>';
    }).join('');
    return '<h2>两周内上线，上线后不推广、持续打磨</h2>' +
      '<p class="h3">阶段</p><div class="phases">' + phases + '</div>' +
      '<p class="h3">两周的七个工作包</p><div class="stack">' + pk + '</div>' +
      '<p class="note">时间不够时按顺序取舍：先砍结论不砍来源，再砍第三个国家，再砍第二批功能。</p>';
  }

  function node(key, extra) {
    var c = D.components[key];
    return '<div class="node ' + (c.s === 'todo' ? '' : esc(c.s)) + ' ' + (extra || '') + '"><div class="hd">' + dot(c.s) +
      '<span>' + esc(c.name) + '</span></div><p>' + esc(c.line) + '</p></div>';
  }
  function viewTech() {
    var L = D.components.layer;
    return '<h2>AI 做获取、抽取和初判；你确认一次，存一份快照；网站只从账本生成</h2>' +
      '<div class="arch">' +
        '<div class="row">' + node('fetch') + '<div class="arr"></div>' +
          '<div class="group ' + (L.s === 'wait' ? 'wait' : '') + '"><div class="hd">' + dot(L.s) + '<b>' + esc(L.name) + '</b><span>' + esc(L.line) + '</span></div>' +
            '<div class="row">' + node('extract') + '<div class="arr"></div>' + node('jury') + '</div></div>' +
        '</div>' +
        '<div class="down"><span></span></div>' +
        '<div class="row">' + node('workspace') + '<div class="gap"></div>' + node('evidence') + '</div>' +
        '<div class="down"><span></span></div>' +
        '<div class="row">' + node('desk', 'key') + '<div class="arr" data-l="你确认"></div>' + node('ledger', 'key') + '</div>' +
        '<div class="down"><span data-l="静态导出，只读账本"></span></div>' +
        '<div class="row">' + node('site') + '</div>' +
        '<div class="vgap"></div>' +
        '<div class="row">' + node('backup') + '</div>' +
      '</div>' +
      '<p class="note">工作区里的东西再怎么改，公开的内容都不会变，直到你再确认一次。线上没有数据库，所以首批没有登录、提交和投票功能。</p>' +
      '<p class="h3">选型</p><div class="card scroll"><table><thead><tr><th>部件</th><th>选型</th><th>状态</th></tr></thead><tbody>' +
        D.stack.map(function (r) {
          return '<tr><td>' + esc(r.part) + '</td><td>' + esc(r.choice) + '</td><td>' + dot(r.s) + ' ' + LABEL[r.s] + '</td></tr>';
        }).join('') + '</tbody></table></div>';
  }

  function member(a) {
    return '<div class="card tm"><div class="hd">' + dot(a.s) + '<span>' + esc(a.name) + '</span></div><p>' + esc(a.does) +
      '</p><p class="gv">交出：' + esc(a.gives) + '</p></div>';
  }
  function viewTeam() {
    var T = D.team;
    return '<h2>做事的不检查自己，检查的不动手改</h2>' +
      '<div class="card founder"><b>你</b><p class="note">确认结论、处理分歧、修改原则和路线</p></div>' +
      '<p class="h3">建造组：把系统搭出来</p><div class="grid g4">' + T.build.map(member).join('') + '</div>' +
      '<p class="h3">运行组：每天产出内容</p><div class="grid g3">' + T.run.map(member).join('') + '</div>' +
      '<p class="note">' + esc(T.note) + '</p>' +
      '<p class="h3">谁检查谁</p><div class="pairs">' +
        '<span class="pair"><b>开发</b> 由 <b>代码审查</b> 检查</span>' +
        '<span class="pair"><b>评审团</b> 由 <b>中立性审查</b> 检查</span>' +
        '<span class="pair"><b>评审团成员</b> 互相看不到结论</span>' +
        '<span class="pair"><b>设计</b> 定稿后 <b>开发</b> 才动工</span>' +
        '<span class="pair">分歧都交给 <b>你</b></span>' +
      '</div>' +
      '<p class="h3">七条协作机制</p><div class="card"><ol class="rules">' +
        T.rules.map(function (r) { return '<li><span>' + esc(r) + '</span></li>'; }).join('') + '</ol></div>';
  }

  function viewPrinciples() {
    return '<h2>八条最高原则，所有决定、开发和协作都围绕它们</h2>' +
      '<div class="grid g2">' + D.principles.map(function (p) {
        return '<div class="card pr"><div class="hd"><span class="n">' + p.n + '</span><h3>' + esc(p.name) + '</h3></div>' +
          '<p class="gl">' + esc(p.gloss) + '</p><div class="how">' + dot(p.s) + '<span>' + esc(p.how) + '</span></div></div>';
      }).join('') + '</div>' +
      '<p class="note">' + esc(D.principlesNote) + '</p>';
  }

  function viewDecisions() {
    function dec(d) {
      return '<div class="dec">' + dot(d.s) + '<span class="id">' + esc(d.id) + '</span><div><span>' + esc(d.t) +
        '</span><span class="by">' + esc(d.by) + '</span>' +
        (d.answer ? '<span class="ans" data-answer-of="' + esc(d.answer) + '"></span>' : '') + '</div></div>';
    }
    var waiting = D.decisions.filter(function (d) { return d.s === 'wait'; });
    var decided = D.decisions.filter(function (d) { return d.s === 'done'; });
    return '<h2>' + decided.length + ' 项已定，' + waiting.length + ' 项等你确认</h2>' +
      '<div class="grid g2">' +
        '<div class="card waitc"><p class="h3" style="margin-bottom:10px">等你确认</p>' + waiting.map(dec).join('') + '</div>' +
        '<div class="card"><p class="h3" style="margin-bottom:10px">已定</p>' + decided.map(dec).join('') + '</div>' +
      '</div>' +
      '<p class="h3">还悬着的问题</p><div class="card"><ul class="items">' +
        D.open.map(function (o) { return item(o.t, 'todo', o.d); }).join('') + '</ul></div>' +
      '<p class="note">带编号的决定在项目的 docs/decisions 文件夹里各有一份记录，写明依据哪条原则、放弃了什么。</p>';
  }

  var VIEWS = { today: viewToday, plan: viewPlan, tech: viewTech, team: viewTeam, principles: viewPrinciples, decisions: viewDecisions };

  function show() {
    var name = location.hash.replace('#', '');
    if (!VIEWS[name]) name = 'today';
    document.getElementById('views').innerHTML = '<section class="view" id="view-' + name + '">' + VIEWS[name]() + '</section>';
    var links = document.querySelectorAll('.tabs a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('href') === '#' + name) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }
    paintAnswers();
  }

  // 输入：选项按钮、文字框、保存。事件挂在容器上，视图重画后仍然有效。
  var views = document.getElementById('views');
  function needOf(target) {
    var el = target.closest ? target.closest('[data-need]') : null;
    return el ? el.getAttribute('data-need') : null;
  }
  views.addEventListener('click', function (e) {
    var id = needOf(e.target);
    if (!id) return;
    var opt = e.target.closest('.opt');
    if (opt) {
      var cur = current(id), picked = opt.getAttribute('data-opt');
      drafts[id] = { choice: cur.choice === picked ? '' : picked, text: cur.text };
      delete failed[id];
      paintAnswers();
      return;
    }
    if (e.target.closest('[data-save]')) save(id);
  });
  views.addEventListener('input', function (e) {
    var id = needOf(e.target);
    if (!id || e.target.tagName !== 'TEXTAREA') return;
    drafts[id] = { choice: current(id).choice, text: e.target.value };
    delete failed[id];
    paintAnswers();
  });

  function save(id) {
    if (!store.db || saving[id] || !isDirty(id)) return;
    var need = D.needs.filter(function (n) { return n.id === id; })[0];
    var body = { item: need ? need.t : id, choice: drafts[id].choice || '', text: (drafts[id].text || '').trim(), at: new Date().toISOString() };
    saving[id] = true;
    paintAnswers();
    store.db.doc('answers/' + id).set(body).then(function () {
      saved[id] = body;
      delete drafts[id];
      delete saving[id];
      paintAnswers();
    }, function (err) {
      delete saving[id];
      failed[id] = err && err.code === 'invalid_argument'
        ? '没有保存上：这次打开的身份没有写入权限。'
        : '没有保存上，请稍后再点一次保存。你写的内容还在。';
      paintAnswers();
    });
  }

  // 只订阅一次。之后每次有变化（包括我在另一边处理了你的回复）都会自动更新。
  function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { store.state = 'off'; paintAnswers(); return; }
    c.use('db').then(function (db) {
      if (!db) { store.state = 'off'; paintAnswers(); return; }
      store.db = db;
      var slow = setTimeout(function () { if (store.state === 'loading') { store.state = 'slow'; paintAnswers(); } }, 10000);
      db.collection('answers').onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { next[d.id] = d.data() || {}; });
        saved = next;
        if (!snap.metadata.fromCache) { clearTimeout(slow); readAt = new Date(); }
        store.state = 'ready';
        paintAnswers();
        paintHeader();
      }, function () {
        clearTimeout(slow);
        store.state = 'off';
        paintAnswers();
      });
    }, function () { store.state = 'off'; paintAnswers(); });
  }

  // 刷新：重新读一遍你的回复；能通知时，同时把“哪些事项有回复”发到你和 Claude 的对话里。
  // 发送必须在点击的当下直接发出，所以放在最前面，前面不等任何东西。
  document.getElementById('refresh').addEventListener('click', function () {
    var answered = Object.keys(saved).filter(function (id) { return saved[id] && (saved[id].choice || saved[id].text); });
    var unsaved = D.needs.filter(function (n) { return isDirty(n.id); }).length;
    var warn = unsaved ? '有 ' + unsaved + ' 项还没点保存，没保存的我读不到。' : '';
    if (sendable()) {
      room.sendToClaudeSession(
        { label: '看板上的回复', action: 'read_board_answers', answered: answered.slice(0, 60) },
        { deliver: 'send', attachPresence: false }
      ).then(function () {
        tell('已交给 Claude。如果弹出了确认窗口，点发送即可。' + warn);
      }, function () {
        tell('这次没能自动通知 Claude。请在对话里说一声“看板填好了”。' + warn);
      });
    } else {
      tell('已刷新。这里没法自动通知 Claude，请在对话里说一声“看板填好了”。' + warn);
    }
    if (store.db) {
      store.db.collection('answers').get().then(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { next[d.id] = d.data() || {}; });
        saved = next;
        readAt = new Date();
        paintAnswers();
        paintHeader();
      }, function () {
        tell('没能读到最新的回复，请稍后再点一次刷新。');
      });
    }
    checkSend();
  });

  function checkSend() {
    if (!room) return;
    room.canSendToClaudeSession().then(function (v) { canSend = v; paintHeader(); }, function () { canSend = 'off'; paintHeader(); });
  }
  function connectRoom() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    c.use('room').then(function (r) { room = r; checkSend(); }, function () {});
  }

  paintHeader();
  window.addEventListener('hashchange', show);
  show();
  connect();
  connectRoom();
})();
</script>
