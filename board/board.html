<style>
/* Layout: a fixed view-switch bar on top, one view shown at a time below; each view is a diagram plus a little text.
   The whole site has one status language: the shape and colour of the dot. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --sunken: #e9edf2;
  --ink: #17212f;
  --ink-2: #4b586b;

  --done: #23795a;
  --doing: #2a62b8;
  --todo: #8b95a5;
  --wait: #b26a00;
  --done-bg: #e3f2ec;
  --doing-bg: #e4edf9;
  --wait-bg: #fbf0dc;
  --font-text: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-display: "Space Grotesk", "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161d; --surface: #1a212b; --sunken: #232c38; --ink: #e8edf3; --ink-2: #b1bccb; --ink-3: #8592a3;
    --line: #2e3947; --line-strong: #4a586a; --done: #5cc49b; --doing: #7fb0f2; --todo: #8592a3; --wait: #e5a84a;
    --done-bg: #17342a; --doing-bg: #1b2d47; --wait-bg: #3a2c12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #1a212b; --sunken: #232c38; --ink: #e8edf3; --ink-2: #b1bccb; --ink-3: #8592a3;
  --line: #2e3947; --line-strong: #4a586a; --done: #5cc49b; --doing: #7fb0f2; --todo: #8592a3; --wait: #e5a84a;
  --done-bg: #17342a; --doing-bg: #1b2d47; --wait-bg: #3a2c12; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: auto; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-text); font-size: 15px; line-height: 1.6;
}
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }

.wrap {
  max-width: 1080px; margin-inline: auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }

.brand span { color: var(--ink-3); font-weight: 500; letter-spacing: 0; margin-left: 8px; font-family: var(--font-text); font-size: 15px; }
.updated { color: var(--ink-3); font-size: 13px; margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-variant-numeric: tabular-nums; }
.refresh {
  font: inherit; font-size: 13px; font-weight: 600; padding: 5px 14px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink);
}
.refresh:hover { background: var(--ink); color: var(--bg); }
.refresh:disabled { opacity: 0.5; cursor: default; }
.refresh-state { font-size: 13px; color: var(--ink-2); background: var(--sunken); border-radius: 8px; padding: 8px 12px; margin-top: -8px; }

/* View switcher */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);

}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tabs a {
  flex: none; padding: 7px 14px; border-radius: 999px; color: var(--ink-2);

}
.tabs a:hover { background: var(--sunken); color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tabs a:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--doing); outline-offset: 2px; }

/* Status language: the only one site-wide */
.s { flex: none; display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--todo); background: transparent; }
.s.done { border-color: var(--done); background: var(--done); }

.item small { display: block; color: var(--ink-2); font-size: 13px; }

.days { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }

.count .v { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.count .l { font-weight: 600; }
.count .t { color: var(--ink-3); font-size: 13px; }

/* Waiting on you: can be filled in directly */
.card.waitc { border-color: var(--wait); background: var(--wait-bg); }
.needs { display: flex; flex-direction: column; gap: 0; }
.needs-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 4px; }
.needs-head .h3 { color: var(--ink-2); }

.need { border-top: 1px solid var(--line-strong); padding-block: 14px; display: flex; flex-direction: column; gap: 8px; }

.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt {
  font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; cursor: pointer;

}

.opt[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* Plan: phase strip + work packages */
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.phase { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; min-width: 0; }

/* Tech: architecture diagram */
.arch { display: flex; flex-direction: column; gap: 0; }
.row { display: flex; gap: 0; align-items: stretch; }

.arr { flex: none; display: flex; align-items: center; justify-content: center; width: 34px; color: var(--ink-3); font-size: 18px; }

.arr[data-l] { width: 92px; flex-direction: column; font-size: 12px; line-height: 1.2; text-align: center; }

table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }

td:last-child, th:last-child { width: 1%; white-space: nowrap; }
.scroll { overflow-x: auto; }

/* Team */
.founder { align-self: center; text-align: center; border: 2px solid var(--ink); }
.founder b { font-family: var(--font-display); font-size: 16px; }
.tm { display: flex; flex-direction: column; gap: 2px; }
.tm .hd { display: flex; align-items: center; gap: 8px; font-weight: 600; }

  <header class="top">
    <div class="brand">KANVERIFY<span>Project Board</span></div>

      <span id="updated"></span>
      <span id="read-at"></span>
      <button type="button" class="refresh" id="refresh">Refresh</button>
    </div>
  </header>
  <p class="refresh-state" id="refresh-state" aria-live="polite" hidden></p>

  <nav class="tabs" aria-label="Views">
    <a href="#today">Today</a>
    <a href="#plan">Plan</a>
    <a href="#tech">Tech</a>
    <a href="#team">Team</a>
    <a href="#principles">Principles</a>
    <a href="#decisions">Decisions</a>
  </nav>

  <ul class="legend" aria-label="Status legend">
    <li><span class="s done"></span>Done</li>
    <li><span class="s doing"></span>In progress</li>

    <li><span class="s wait"></span>Waiting on you</li>
  </ul>

<script>
(function () {
  var D = JSON.parse(document.getElementById('board-data').textContent);
  var LABEL = { done: 'Done', doing: 'In progress', todo: 'Not started', wait: 'Waiting on you' };

  // The founder's replies. saved comes from the board's database; drafts are unsaved input, kept when switching views.
  var saved = {};
  var drafts = {};
  var store = { db: null, state: 'loading' }; // loading | ready | slow | off
  var saving = {};
  var failed = {};
  var readAt = null;          // time of the last read of replies from the database
  var room = null;            // used to send "I have filled it in" into the conversation with Claude
  var canSend = 'off';

  function clock(d) {
    function two(n) { return (n < 10 ? '0' : '') + n; }
    return two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());
  }
  function sendable() {
    return !!room && (canSend === 'available' || canSend === 'available_if_summoned' || canSend === 'available_if_opened');
  }
  function paintHeader() {
    document.getElementById('updated').textContent = 'Board updated ' + D.meta.updated;
    document.getElementById('read-at').textContent = readAt ? 'Replies read at ' + clock(readAt) : '';
    document.getElementById('refresh').textContent = sendable() ? 'Refresh and notify Claude' : 'Refresh';
  }
  function tell(text) {
    var el = document.getElementById('refresh-state');
    el.textContent = text;
    el.hidden = !text;
  }

  function esc(v) {
    return String(v).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function dot(s) {
    return '<span class="s ' + (s === 'todo' ? '' : esc(s)) + '" role="img" aria-label="' + LABEL[s] + '" title="' + LABEL[s] + '"></span>';
  }
  function item(t, s, small) {
    return '<li class="item">' + dot(s) + '<div><span>' + esc(t) + '</span>' +
      (small ? '<small>' + esc(small) + '</small>' : '') + '</div></li>';
  }
  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    function two(n) { return (n < 10 ? '0' : '') + n; }
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
  }
  function current(id) {
    var a = drafts[id] || saved[id] || {};
    return { choice: a.choice || '', text: a.text || '' };
  }
  function isDirty(id) {
    if (!drafts[id]) return false;
    var s = saved[id] || {};
    return (drafts[id].choice || '') !== (s.choice || '') || (drafts[id].text || '') !== (s.text || '');
  }

  function needBlock(n) {
    var opts = n.options.map(function (o) {
      return '<button type="button" class="opt" data-opt="' + esc(o) + '" aria-pressed="false">' + esc(o) + '</button>';
    }).join('');
    return '<div class="need" data-need="' + esc(n.id) + '">' +
      '<div class="need-title">' + dot('wait') + '<span>' + esc(n.t) + '</span></div>' +
      '<p class="need-desc">' + esc(n.d) + '</p>' +
      (n.warn ? '<p class="need-warn">' + esc(n.warn) + '</p>' : '') +
      (opts ? '<div class="opts" role="group" aria-label="' + esc(n.t) + '">' + opts + '</div>' : '') +
      '<textarea id="answer-' + esc(n.id) + '" aria-label="' + esc(n.t) + ': reply" placeholder="' + esc(n.placeholder || '') + '"></textarea>' +
      '<div class="need-foot"><button type="button" class="save" data-save>Save</button><span class="state" aria-live="polite"></span></div>' +
    '</div>';
  }

  // Fill replies from the database and unsaved input back into the form, and update each item's status text. The form is not redrawn, so typing is not interrupted.
  function paintAnswers() {
    var note = document.getElementById('store-note');
    if (note) {
      note.textContent = store.state === 'ready' ? 'Reply here directly; once saved I can read it.'
        : store.state === 'loading' ? 'Loading your earlier replies…'
        : store.state === 'slow' ? 'Cannot reach the place where replies are stored for now; what is shown below may be out of date.'
        : 'Replies cannot be saved the way this page was opened. Please open the board inside Claude to fill it in.';
    }
    var blocks = document.querySelectorAll('[data-need]');
    for (var i = 0; i < blocks.length; i++) {
      var el = blocks[i], id = el.getAttribute('data-need'), cur = current(id);
      var buttons = el.querySelectorAll('.opt');
      for (var j = 0; j < buttons.length; j++) {
        buttons[j].setAttribute('aria-pressed', buttons[j].getAttribute('data-opt') === cur.choice ? 'true' : 'false');
      }
      var ta = el.querySelector('textarea');
      if (ta !== document.activeElement && ta.value !== cur.text) ta.value = cur.text;
      var dirty = isDirty(id), btn = el.querySelector('[data-save]'), st = el.querySelector('.state');
      btn.disabled = !store.db || !!saving[id] || !dirty;
      st.className = 'state';
      if (saving[id]) st.textContent = 'Saving…';
      else if (failed[id]) { st.textContent = failed[id]; st.className = 'state bad'; }
      else if (dirty) st.textContent = 'Unsaved changes';
      else if (saved[id] && (saved[id].choice || saved[id].text)) { st.textContent = 'Saved · ' + when(saved[id].at); st.className = 'state ok'; }
      else st.textContent = 'No reply yet';
    }
    var marks = document.querySelectorAll('[data-answer-of]');
    for (var k = 0; k < marks.length; k++) {
      var a = saved[marks[k].getAttribute('data-answer-of')];
      marks[k].innerHTML = a && (a.choice || a.text)
        ? '<span class="chip">You replied</span> ' + esc(a.choice || '') + (a.choice && a.text ? ': ' : '') + esc(a.text || '')
        : '<a href="#today">Reply under "Today"</a>';
    }
  }

  function viewToday() {
    var m = D.meta, cells = '';
    for (var i = 1; i <= m.totalDays; i++) {
      var c = i < m.day ? 'past' : (i === m.day ? 'now' : '');
      if (i === 7 || i === m.totalDays) c += ' gate';
      cells += '<i class="' + c + '" title="Day ' + i + '"></i>';
    }
    return '<h2>' + esc(m.headline) + '</h2>' +
      '<div class="card stack">' +
        '<div class="dayline"><span>Two-week launch plan <strong>Day ' + m.day + ' of ' + m.totalDays + '</strong></span>' +
        '<span>Checkpoints on day 7 and day 14, target launch date ' + esc(m.launch) + '</span></div>' +
        '<div class="days" aria-hidden="true">' + cells + '</div>' +
      '</div>' +
      '<div class="grid g4">' + D.counts.map(function (c) {
        return '<div class="card count"><div class="v">' + esc(c.value) + '</div><div class="l">' + esc(c.label) +
          '</div><div class="t">' + esc(c.target) + '</div></div>';
      }).join('') + '</div>' +
      '<div class="card waitc needs"><div class="needs-head"><p class="h3">Waiting on you: ' + D.needs.length + ' items</p>' +
        '<span class="store-note" id="store-note"></span></div>' +
        D.needs.map(needBlock).join('') + '</div>' +
      '<div class="grid g2">' +
        '<div class="card stack"><p class="h3">Done</p><ul class="items">' +
          D.done.map(function (t) { return item(t, 'done'); }).join('') + '</ul></div>' +
        '<div class="card stack"><p class="h3">Next</p><ul class="items">' +
          D.next.map(function (t) { return item(t, 'todo'); }).join('') + '</ul></div>' +
      '</div>';
  }

  function viewPlan() {
    var m = D.meta;
    var phases = D.phases.map(function (p) {
      return '<div class="phase ' + esc(p.s) + (p.gate ? ' gate' : '') + '"><div class="hd">' + dot(p.s) + '<span>' + esc(p.name) +
        '</span></div><div class="dt">' + esc(p.dates) + '</div><div class="ln">' + esc(p.line) + '</div></div>';
    }).join('');
    var pk = D.packages.map(function (p) {
      var cells = '';
      for (var i = 1; i <= m.totalDays; i++) {
        var inside = i >= p.from && i <= p.to;
        cells += '<i class="' + (inside ? (p.to < m.day ? 'past' : (p.from <= m.day ? 'now' : 'later')) : '') + '"></i>';
      }
      var cur = m.day >= p.from && m.day <= p.to;
      return '<div class="card pkg' + (cur ? ' cur' : '') + '">' +
        '<div class="when"><b>' + (p.from === p.to ? 'Day ' + p.from : 'Days ' + p.from + ' to ' + p.to) +
          '</b><span>' + esc(p.dates) + '</span><div class="days" aria-hidden="true">' + cells + '</div></div>' +
        '<div><h3>' + esc(p.title) + '</h3><ul class="items">' +
          p.tasks.map(function (t) { return item(t.t, t.s); }).join('') + '</ul>' +
          (p.check ? '<div class="check"><span class="s wait"></span>' + esc(p.check) + '</div>' : '') +
        '</div></div>';
    }).join('');
    return '<h2>Launch within two weeks; no promotion after launch, keep polishing</h2>' +
      '<p class="h3">Phases</p><div class="phases">' + phases + '</div>' +
      '<p class="h3">The seven work packages of the two weeks</p><div class="stack">' + pk + '</div>' +
      '<p class="note">If time runs short, cut in this order: verdicts before sources, then the third country, then second-batch features.</p>';
  }

  function node(key, extra) {
    var c = D.components[key];
    return '<div class="node ' + (c.s === 'todo' ? '' : esc(c.s)) + ' ' + (extra || '') + '"><div class="hd">' + dot(c.s) +
      '<span>' + esc(c.name) + '</span></div><p>' + esc(c.line) + '</p></div>';
  }
  function viewTech() {
    var L = D.components.layer;
    return '<h2>AI does fetching, extraction and first-pass verdicts; you confirm once, one snapshot is stored; the site is generated only from the ledger</h2>' +
      '<div class="arch">' +
        '<div class="row">' + node('fetch') + '<div class="arr"></div>' +
          '<div class="group ' + (L.s === 'wait' ? 'wait' : '') + '"><div class="hd">' + dot(L.s) + '<b>' + esc(L.name) + '</b><span>' + esc(L.line) + '</span></div>' +
            '<div class="row">' + node('extract') + '<div class="arr"></div>' + node('jury') + '</div></div>' +
        '</div>' +
        '<div class="down"><span></span></div>' +
        '<div class="row">' + node('workspace') + '<div class="gap"></div>' + node('evidence') + '</div>' +
        '<div class="down"><span></span></div>' +
        '<div class="row">' + node('desk', 'key') + '<div class="arr" data-l="You confirm"></div>' + node('ledger', 'key') + '</div>' +
        '<div class="down"><span data-l="Static export, reads the ledger only"></span></div>' +
        '<div class="row">' + node('site') + '</div>' +
        '<div class="vgap"></div>' +
        '<div class="row">' + node('backup') + '</div>' +
      '</div>' +
      '<p class="note">No matter how the workspace changes, public content does not change until you confirm again. There is no database online, so the first release has no login, submission or voting.</p>' +
      '<p class="h3">Stack</p><div class="card scroll"><table><thead><tr><th>Part</th><th>Choice</th><th>Status</th></tr></thead><tbody>' +
        D.stack.map(function (r) {
          return '<tr><td>' + esc(r.part) + '</td><td>' + esc(r.choice) + '</td><td>' + dot(r.s) + ' ' + LABEL[r.s] + '</td></tr>';
        }).join('') + '</tbody></table></div>';
  }

  function member(a) {
    return '<div class="card tm"><div class="hd">' + dot(a.s) + '<span>' + esc(a.name) + '</span></div><p>' + esc(a.does) +
      '</p><p class="gv">Delivers: ' + esc(a.gives) + '</p></div>';
  }
  function viewTeam() {
    var T = D.team;
    return '<h2>Those who do the work do not check it; those who check do not edit</h2>' +
      '<div class="card founder"><b>You</b><p class="note">Confirm verdicts, resolve disagreements, change principles and route</p></div>' +
      '<p class="h3">Build group: builds the system</p><div class="grid g4">' + T.build.map(member).join('') + '</div>' +
      '<p class="h3">Run group: produces content every day</p><div class="grid g3">' + T.run.map(member).join('') + '</div>' +
      '<p class="note">' + esc(T.note) + '</p>' +
      '<p class="h3">Who checks whom</p><div class="pairs">' +
        '<span class="pair"><b>Development</b> is checked by <b>Code review</b></span>' +
        '<span class="pair"><b>The jury</b> is checked by <b>Neutrality review</b></span>' +
        '<span class="pair"><b>Jury members</b> cannot see each other&rsquo;s verdicts</span>' +
        '<span class="pair"><b>Development</b> starts only after <b>Design</b> is finalised</span>' +
        '<span class="pair">Disagreements go to <b>you</b></span>' +
      '</div>' +
      '<p class="h3">Seven collaboration rules</p><div class="card"><ol class="rules">' +
        T.rules.map(function (r) { return '<li><span>' + esc(r) + '</span></li>'; }).join('') + '</ol></div>';
  }

  function viewPrinciples() {
    return '<h2>Eight top principles; all decisions, development and collaboration revolve around them</h2>' +
      '<div class="grid g2">' + D.principles.map(function (p) {
        return '<div class="card pr"><div class="hd"><span class="n">' + p.n + '</span><h3>' + esc(p.name) + '</h3></div>' +
          '<p class="gl">' + esc(p.gloss) + '</p><div class="how">' + dot(p.s) + '<span>' + esc(p.how) + '</span></div></div>';
      }).join('') + '</div>' +
      '<p class="note">' + esc(D.principlesNote) + '</p>';
  }

  function viewDecisions() {
    function dec(d) {
      return '<div class="dec">' + dot(d.s) + '<span class="id">' + esc(d.id) + '</span><div><span>' + esc(d.t) +
        '</span><span class="by">' + esc(d.by) + '</span>' +
        (d.answer ? '<span class="ans" data-answer-of="' + esc(d.answer) + '"></span>' : '') + '</div></div>';
    }
    var waiting = D.decisions.filter(function (d) { return d.s === 'wait'; });
    var decided = D.decisions.filter(function (d) { return d.s === 'done'; });
    return '<h2>' + decided.length + ' decided, ' + waiting.length + ' waiting for your confirmation</h2>' +
      '<div class="grid g2">' +
        '<div class="card waitc"><p class="h3" style="margin-bottom:10px">Waiting for your confirmation</p>' + waiting.map(dec).join('') + '</div>' +
        '<div class="card"><p class="h3" style="margin-bottom:10px">Decided</p>' + decided.map(dec).join('') + '</div>' +
      '</div>' +
      '<p class="h3">Open questions</p><div class="card"><ul class="items">' +
        D.open.map(function (o) { return item(o.t, 'todo', o.d); }).join('') + '</ul></div>' +
      '<p class="note">Each numbered decision has a record in the project&rsquo;s docs/decisions folder, stating which principle it rests on and what was given up.</p>';
  }

  var VIEWS = { today: viewToday, plan: viewPlan, tech: viewTech, team: viewTeam, principles: viewPrinciples, decisions: viewDecisions };

  function show() {
    var name = location.hash.replace('#', '');
    if (!VIEWS[name]) name = 'today';
    document.getElementById('views').innerHTML = '<section class="view" id="view-' + name + '">' + VIEWS[name]() + '</section>';
    var links = document.querySelectorAll('.tabs a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('href') === '#' + name) links[i].setAttribute('aria-current', 'page');
      else links[i].removeAttribute('aria-current');
    }
    paintAnswers();
  }

  // Input: option buttons, text box, save. Events are attached to the container, so they still work after a view is redrawn.
  var views = document.getElementById('views');
  function needOf(target) {
    var el = target.closest ? target.closest('[data-need]') : null;
    return el ? el.getAttribute('data-need') : null;
  }
  views.addEventListener('click', function (e) {
    var id = needOf(e.target);
    if (!id) return;
    var opt = e.target.closest('.opt');
    if (opt) {
      var cur = current(id), picked = opt.getAttribute('data-opt');
      drafts[id] = { choice: cur.choice === picked ? '' : picked, text: cur.text };
      delete failed[id];
      paintAnswers();
      return;
    }
    if (e.target.closest('[data-save]')) save(id);
  });
  views.addEventListener('input', function (e) {
    var id = needOf(e.target);
    if (!id || e.target.tagName !== 'TEXTAREA') return;
    drafts[id] = { choice: current(id).choice, text: e.target.value };
    delete failed[id];
    paintAnswers();
  });

  function save(id) {
    if (!store.db || saving[id] || !isDirty(id)) return;
    var need = D.needs.filter(function (n) { return n.id === id; })[0];
    var body = { item: need ? need.t : id, choice: drafts[id].choice || '', text: (drafts[id].text || '').trim(), at: new Date().toISOString() };
    saving[id] = true;
    paintAnswers();
    store.db.doc('answers/' + id).set(body).then(function () {
      saved[id] = body;
      delete drafts[id];
      delete saving[id];
      paintAnswers();
    }, function (err) {
      delete saving[id];
      failed[id] = err && err.code === 'invalid_argument'
        ? 'Not saved: this way of opening the page has no write permission.'
        : 'Not saved; please click Save again in a moment. What you wrote is still here.';
      paintAnswers();
    });
  }

  // Subscribe only once. After that every change (including me handling your reply on the other side) updates automatically.
  function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { store.state = 'off'; paintAnswers(); return; }
    c.use('db').then(function (db) {
      if (!db) { store.state = 'off'; paintAnswers(); return; }
      store.db = db;
      var slow = setTimeout(function () { if (store.state === 'loading') { store.state = 'slow'; paintAnswers(); } }, 10000);
      db.collection('answers').onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { next[d.id] = d.data() || {}; });
        saved = next;
        if (!snap.metadata.fromCache) { clearTimeout(slow); readAt = new Date(); }
        store.state = 'ready';
        paintAnswers();
        paintHeader();
      }, function () {
        clearTimeout(slow);
        store.state = 'off';
        paintAnswers();
      });
    }, function () { store.state = 'off'; paintAnswers(); });
  }

  // Refresh: re-read your replies; when notifying is possible, also send "which items have replies" into the conversation with Claude.
  // Sending must happen directly at the moment of the click, so it goes first and waits for nothing.
  document.getElementById('refresh').addEventListener('click', function () {
    var answered = Object.keys(saved).filter(function (id) { return saved[id] && (saved[id].choice || saved[id].text); });
    var unsaved = D.needs.filter(function (n) { return isDirty(n.id); }).length;
    var warn = unsaved ? unsaved + ' item(s) not saved yet; I cannot read unsaved ones.' : '';
    if (sendable()) {
      room.sendToClaudeSession(
        { label: 'Replies on the board', action: 'read_board_answers', answered: answered.slice(0, 60) },
        { deliver: 'send', attachPresence: false }
      ).then(function () {
        tell('Handed to Claude. If a confirmation window pops up, just click send. ' + warn);
      }, function () {
        tell('Could not notify Claude automatically this time. Please say "board filled in" in the conversation. ' + warn);
      });
    } else {
      tell('Refreshed. Claude cannot be notified automatically from here; please say "board filled in" in the conversation. ' + warn);
    }
    if (store.db) {
      store.db.collection('answers').get().then(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { next[d.id] = d.data() || {}; });
        saved = next;
        readAt = new Date();
        paintAnswers();
        paintHeader();
      }, function () {
        tell('Could not read the latest replies; please click Refresh again in a moment.');
      });
    }
    checkSend();
  });

  function checkSend() {
    if (!room) return;
    room.canSendToClaudeSession().then(function (v) { canSend = v; paintHeader(); }, function () { canSend = 'off'; paintHeader(); });
  }
  function connectRoom() {
    var c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    c.use('room').then(function (r) { room = r; checkSend(); }, function () {});
  }

  paintHeader();
  window.addEventListener('hashchange', show);
  show();
  connect();
  connectRoom();
})();
</script>
